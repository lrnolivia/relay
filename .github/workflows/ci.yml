name: Relay workspace checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'icons/**'
      - 'packages/**'
      - 'features/**'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - '.node-version'
      - 'wrangler.jsonc'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'icons/**'
      - 'packages/**'
      - 'features/**'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'package.json'
      - '.node-version'
      - 'wrangler.jsonc'
      - '.github/workflows/**'

permissions:
  contents: read

env:
  RELAY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: relay-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  website-production:
    name: verify actual deployed website
    needs: quality
    if: github.event_name == 'workflow_dispatch' || needs.quality.outputs.production_required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELAY_CI_JOB: website-production
      CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF }}
      EXPECTED_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        id: source-checkout
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        id: node-setup
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            package.json
            .node-version
      - name: Verify exact toolchain and lock before install
        id: setup-toolchain
        env:
          RELAY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-stage.mjs toolchain -- npm run check:toolchain
      - id: setup-install
        run: node scripts/ci-stage.mjs install -- npm ci
      - id: setup-build
        run: WORKERS_CI_COMMIT_SHA=${{ github.event.pull_request.head.sha || github.sha }} node scripts/ci-stage.mjs build -- npm run build
      - id: setup-browser
        run: node scripts/ci-stage.mjs browser -- npx playwright install --with-deps chromium
      - name: Verify exact live source and capture actual website pages
        id: verify-production
        run: node scripts/ci-stage.mjs production -- node apps/web/verify-production.mjs
      - name: Retain and verify exact interactive sample build
        id: verify-retained
        run: node scripts/ci-stage.mjs retained -- node scripts/retain-web-preview.mjs
      - name: Summarize observed CI stage outcomes
        if: always()
        env:
          RELAY_STAGE_OUTCOMES: >-
            {"toolchain":"${{ steps.setup-toolchain.outcome }}","install":"${{ steps.setup-install.outcome }}","build":"${{ steps.setup-build.outcome }}","browser":"${{ steps.setup-browser.outcome }}","source-checkout":"${{ steps.source-checkout.outcome }}","node-setup":"${{ steps.node-setup.outcome }}","production":"${{ steps.verify-production.outcome }}","retained":"${{ steps.verify-retained.outcome }}"}
        run: node scripts/ci-stage.mjs --summary website-production
      - name: Preserve redacted CI stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-ci-stages-website-production-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-evidence/ci-stages/
          if-no-files-found: error
      - name: Preserve production screenshots and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-website-production-${{ github.sha }}
          path: qa-evidence/production/
          if-no-files-found: error
      - name: Preserve retained build evidence and receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-retained-preview-${{ github.sha }}
          path: qa-evidence/retained/
          if-no-files-found: error
  quality:
    name: quality
    outputs:
      production_required: ${{ steps.production-scope.outputs.required }}
    runs-on: ubuntu-latest
    # Five required suites each have a 15-minute cap; leave setup/upload margin.
    timeout-minutes: 95
    env:
      RELAY_CI_JOB: quality
    steps:
      - uses: actions/checkout@v4
        id: source-checkout
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        id: node-setup
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            package.json
            .node-version
      - name: Resolve deploying source scope
        id: production-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          node --input-type=module <<'JS'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync} from 'node:fs';
          import {needsProductionVerification} from './apps/web/production-scope.mjs';
          let required=false;
          if(process.env.EVENT_NAME==='push'){
            const before=process.env.BEFORE_SHA,head=process.env.HEAD_SHA;
            if(!/^[a-f0-9]{40}$/.test(before||'')||!/^([a-f0-9]{40})$/.test(head||''))throw Error('Missing exact push identities');
            const files=/^0+$/.test(before)?execFileSync('git',['ls-tree','-r','--name-only','-z',head]):execFileSync('git',['diff','--name-only','-z',before,head]);
            required=needsProductionVerification(files.toString().split('\0').filter(Boolean));
          }
          appendFileSync(process.env.GITHUB_OUTPUT,'required='+required+'\n');
          JS
      - name: Verify exact toolchain and lock before install
        id: setup-toolchain
        env:
          RELAY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-stage.mjs toolchain -- npm run check:toolchain
      - name: Run cheap toolchain contract tests before browser setup
        id: setup-focused
        run: node scripts/ci-stage.mjs focused -- npm run test:toolchain
      - name: Install workspace
        id: setup-install
        run: node scripts/ci-stage.mjs install -- npm ci
      - name: Audit source contracts and run named nonbrowser tests
        id: setup-contracts
        env:
          RELAY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RELAY_CONTRACT_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/ci-stage.mjs contracts -- npm run test:source-contracts
      - name: Build exact web and MCP payloads
        id: setup-build
        run: WORKERS_CI_COMMIT_SHA=${{ github.event.pull_request.head.sha || github.sha }} node scripts/ci-stage.mjs build -- npm run build
      - name: Verify bundled Worker in local workerd
        id: setup-runtime
        env:
          RELAY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-stage.mjs runtime -- npm run verify:runtime
      - name: Install browser runtime once
        id: setup-browser
        run: node scripts/ci-stage.mjs browser -- npx playwright install --with-deps chromium
      - name: Typecheck Relay 2.0
        id: setup-typecheck
        run: node scripts/ci-stage.mjs typecheck -- npm run typecheck:2.0 --workspace @relay/web
      - name: Run workspace, contract, API, browser and React tests
        id: verify-suites
        env:
          RELAY_QA_OUTPUT: ${{ github.workspace }}/qa-evidence/relay-motion
          RELAY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm test
      - name: Account for suites blocked by setup
        if: always() && (steps.setup-toolchain.outcome != 'success' || steps.setup-focused.outcome != 'success' || steps.setup-install.outcome != 'success' || steps.setup-contracts.outcome != 'success' || steps.setup-browser.outcome != 'success' || steps.setup-build.outcome != 'success' || steps.setup-typecheck.outcome != 'success' || steps.setup-runtime.outcome != 'success')
        env:
          RELAY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RELAY_SETUP_TOOLCHAIN: ${{ steps.setup-toolchain.outcome }}
          RELAY_SETUP_FOCUSED: ${{ steps.setup-focused.outcome }}
          RELAY_SETUP_INSTALL: ${{ steps.setup-install.outcome }}
          RELAY_SETUP_CONTRACTS: ${{ steps.setup-contracts.outcome }}
          RELAY_SETUP_BROWSER: ${{ steps.setup-browser.outcome }}
          RELAY_SETUP_BUILD: ${{ steps.setup-build.outcome }}
          RELAY_SETUP_RUNTIME: ${{ steps.setup-runtime.outcome }}
          RELAY_SETUP_TYPECHECK: ${{ steps.setup-typecheck.outcome }}
        run: node scripts/ci-test-orchestrator.mjs --blocked
      - name: Preserve exact toolchain and build identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-toolchain-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-evidence/toolchain/
          if-no-files-found: error
      - name: Preserve source and named-test contract mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-source-test-contracts-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-evidence/source-test-contracts/
          if-no-files-found: error
      - name: Preserve Worker bundle and local runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-worker-runtime-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-evidence/worker-runtime/
          if-no-files-found: error
      - name: Preserve required-suite accounting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-required-suites-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-evidence/test-workflow/
          if-no-files-found: error
      - name: Preserve Relay motion and layout evidence
        if: always() && github.head_ref == 'relay/mcp-rebuild-20261003'
        uses: actions/upload-artifact@v4
        with:
          name: relay-motion-${{ github.event.pull_request.head.sha || github.sha }}
          path: qa-evidence/relay-motion/
          if-no-files-found: error
      - name: Verify contextual card visuals and preserve Inspector evidence
        id: verify-context-card
        if: github.head_ref == 'relay/mcp-rebuild-20261003' || startsWith(github.head_ref, 'relay/context-card-visual-parity-') || (github.event_name == 'push' && contains(github.event.head_commit.message, 'contextual card visual parity'))
        env:
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PREVIEW_PR: ${{ github.event.pull_request.number }}
        run: node scripts/ci-stage.mjs context-card -- node scripts/verify-context-card-visuals.mjs
      - name: Summarize observed CI stage outcomes
        if: always()
        env:
          RELAY_STAGE_OUTCOMES: >-
            {"toolchain":"${{ steps.setup-toolchain.outcome }}","install":"${{ steps.setup-install.outcome }}","build":"${{ steps.setup-build.outcome }}","browser":"${{ steps.setup-browser.outcome }}","source-checkout":"${{ steps.source-checkout.outcome }}","node-setup":"${{ steps.node-setup.outcome }}","focused":"${{ steps.setup-focused.outcome }}","contracts":"${{ steps.setup-contracts.outcome }}","runtime":"${{ steps.setup-runtime.outcome }}","typecheck":"${{ steps.setup-typecheck.outcome }}","suites":"${{ steps.verify-suites.outcome }}","context-card":"${{ steps.verify-context-card.outcome }}","production-scope":"${{ steps.production-scope.outcome }}"}
        run: node scripts/ci-stage.mjs --summary quality
      - name: Preserve redacted CI stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-ci-stages-quality-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-evidence/ci-stages/
          if-no-files-found: error
      - name: Preserve contextual card captures
        if: always() && (github.head_ref == 'relay/mcp-rebuild-20261003' || startsWith(github.head_ref, 'relay/context-card-visual-parity-') || (github.event_name == 'push' && contains(github.event.head_commit.message, 'contextual card visual parity')))
        uses: actions/upload-artifact@v4
        with:
          name: relay-context-cards-${{ github.event.pull_request.number || github.sha }}
          path: qa-evidence/context-cards/
          if-no-files-found: error
      - name: Preserve actual website route screenshots
        if: always() && (startsWith(github.head_ref, 'relay/retained-interactive-previews-') || startsWith(github.head_ref, 'relay/website-work-queue-views-') || startsWith(github.head_ref, 'relay/website-post-release-polish-') || startsWith(github.head_ref, 'relay/website-2.0-repair-') || startsWith(github.head_ref, 'relay/website-project-context-polish-') || startsWith(github.head_ref, 'relay/website-notifications-review-'))
        uses: actions/upload-artifact@v4
        with:
          name: relay-website-${{ github.event.pull_request.number }}
          path: apps/web/qa-evidence/website/
          if-no-files-found: error
  visual-review-preview:
    needs: quality
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == true && (startsWith(github.head_ref, 'relay/retained-interactive-previews-') || startsWith(github.head_ref, 'relay/website-work-queue-views-') || startsWith(github.head_ref, 'relay/2.0-approved-visual-port-') || startsWith(github.head_ref, 'relay/website-project-context-polish-') || startsWith(github.head_ref, 'relay/website-notifications-review-'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELAY_CI_JOB: visual-review-preview
      CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
      CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF }}
      PREVIEW_COMMIT: ${{ github.event.pull_request.head.sha }}
      PREVIEW_PR: ${{ github.event.pull_request.number }}
      PREVIEW_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        id: source-checkout
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        id: node-setup
        with:
          node-version-file: '.node-version'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            package.json
            .node-version
      - name: Verify exact toolchain and lock before install
        id: setup-toolchain
        env:
          RELAY_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci-stage.mjs toolchain -- npm run check:toolchain
      - id: setup-install
        run: node scripts/ci-stage.mjs install -- npm ci
      - name: Check out the exact draft PR head
        id: setup-checkout
        run: node scripts/ci-stage.mjs checkout -- git checkout "$PREVIEW_COMMIT"
      - name: Build exact Relay web assets
        id: setup-build
        run: WORKERS_CI_COMMIT_SHA="$PREVIEW_COMMIT" node scripts/ci-stage.mjs build -- npm run build
      - id: setup-browser
        run: node scripts/ci-stage.mjs browser -- npx playwright install --with-deps chromium
      - name: Capture and ingest Inspector preview evidence
        id: verify-visual-review
        run: |
          if [[ "$PREVIEW_BRANCH" == relay/website-notifications-review-* ]]; then
            node scripts/ci-stage.mjs visual-review -- node apps/web/test/notifications-visual-review.mjs
          else
            node scripts/ci-stage.mjs visual-review -- node apps/web/test/visual-review.mjs
          fi
      - name: Summarize observed CI stage outcomes
        if: always()
        env:
          RELAY_STAGE_OUTCOMES: >-
            {"toolchain":"${{ steps.setup-toolchain.outcome }}","install":"${{ steps.setup-install.outcome }}","build":"${{ steps.setup-build.outcome }}","browser":"${{ steps.setup-browser.outcome }}","source-checkout":"${{ steps.source-checkout.outcome }}","node-setup":"${{ steps.node-setup.outcome }}","checkout":"${{ steps.setup-checkout.outcome }}","visual-review":"${{ steps.verify-visual-review.outcome }}"}
        run: node scripts/ci-stage.mjs --summary visual-review-preview
      - name: Preserve redacted CI stage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-ci-stages-visual-review-preview-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-evidence/ci-stages/
          if-no-files-found: error
      - name: Preserve preview captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relay-visual-review-${{ github.event.pull_request.number }}
          path: qa-evidence/
          if-no-files-found: ignore


