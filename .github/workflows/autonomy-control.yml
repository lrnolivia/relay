name: Relay safety control

on:
  workflow_dispatch:
    inputs:
      requests:
        description: 'JSON array of 1-2 exact relay_autonomy requests, with explicit revision, operation ID and authorization where required'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: relay-safety-control
  cancel-in-progress: false

jobs:
  control:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Execute exact safety request and verify durable readback
        env:
          SAFETY_REQUESTS: ${{ inputs.requests }}
          CF_ACCESS_CLIENT_ID: ${{ vars.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const raw = process.env.SAFETY_REQUESTS;
          assert.ok(raw && Buffer.byteLength(raw) <= 16384, 'Safety requests must fit 16 KiB');
          const requests = JSON.parse(raw);
          assert.ok(Array.isArray(requests) && requests.length >= 1 && requests.length <= 2, 'One or two exact requests are required');
          const actions = new Set(['status', 'hold', 'resume', 'healthy', 'approve', 'rollback']);
          for (const input of requests) {
            assert.ok(input && actions.has(input.action) && /^(global|[a-z0-9-]{1,80})$/.test(input.scope), 'Unsupported safety action or scope');
            if (input.action !== 'status') {
              assert.ok(Number.isSafeInteger(input.expected_revision) && input.expected_revision >= 0, 'An explicit revision is required');
              assert.match(input.operation_id || '', /^[-\w]{8,110}$/);
            }
          }
          const id = process.env.CF_ACCESS_CLIENT_ID, secret = process.env.CF_ACCESS_CLIENT_SECRET;
          assert.ok(id && secret, 'Existing authenticated CI identity is required');
          const headers = {
            Authorization: JSON.stringify({'cf-access-client-id': id, 'cf-access-client-secret': secret}),
            'CF-Access-Client-Id': id, 'CF-Access-Client-Secret': secret,
            'Content-Type': 'application/json', Accept: 'application/json, text/event-stream'
          };
          const diagnostic = value => String(value || 'No diagnostic returned').replaceAll(id, '[redacted]').replaceAll(secret, '[redacted]').slice(0, 1500);
          let sequence = 0;
          async function rpc(method, params) {
            const rpcId = ++sequence;
            const response = await fetch('https://relay.loew.fi/mcp', {
              method: 'POST', headers, redirect: 'error', signal: AbortSignal.timeout(20000),
              body: JSON.stringify({jsonrpc: '2.0', id: rpcId, method, params})
            });
            assert.ok(response.ok, 'Authenticated safety transport failed with HTTP ' + response.status);
            const text = await response.text();
            assert.ok(Buffer.byteLength(text) <= 1048576, 'Safety response exceeds limit');
            const messages = response.headers.get('content-type')?.includes('text/event-stream')
              ? text.split(/\r?\n\r?\n/).map(block => block.split(/\r?\n/).filter(line => line.startsWith('data:')).map(line => line.slice(5).trim()).join('\n')).filter(Boolean).map(line => JSON.parse(line))
              : [JSON.parse(text)];
            const message = messages.find(item => item.id === rpcId);
            assert.ok(message && !message.error && message.result, 'MCP safety request failed: ' + diagnostic(message?.error?.message));
            if (message.result.isError) throw Error('Relay rejected safety request; reconcile before retrying: ' + diagnostic(message.result.content?.filter(item => item.type === 'text').map(item => item.text).join('\n')));
            return message.result;
          }
          const inventory = await rpc('tools/list', {});
          const tool = inventory.tools?.find(item => item.name === 'relay_autonomy');
          assert.ok(tool?.inputSchema?.properties?.action?.enum?.includes('approve'), 'Deployed server must expose the safety contract');
          const call = async input => {
            const result = await rpc('tools/call', {name: 'relay_autonomy', arguments: input});
            const value = result.structuredContent;
            assert.ok(value?.ok === true && value.state?.scope === input.scope, 'Complete durable safety receipt is required');
            return value;
          };
          for (const input of requests) {
            const receipt = await call(input);
            const readback = await call({action: 'status', scope: input.scope});
            assert.deepEqual(readback.state, receipt.state, 'Safety state changed before readback; reconcile before further mutation');
            if (input.action === 'approve') {
              for (const key of ['worker', 'version_id', 'source_sha', 'compatibility_id', 'evidence']) assert.equal(readback.state.last_user_approved?.[key], input.target[key]);
              assert.equal(readback.state.last_user_approved?.approval?.text, input.approval.text);
              assert.equal(readback.state.last_user_approved?.approval?.source, input.approval.source);
            }
            console.log('SAFETY_RECEIPT=' + JSON.stringify({action: input.action, operation_id: input.operation_id, state: readback.state, duplicate: receipt.duplicate, verified_release: receipt.verified_release}));
          }
          NODE
