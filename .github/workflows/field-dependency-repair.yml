name: field dependency repair

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: field-dependency-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIELD_TOKEN: ${{ secrets.RUNNER_GITHUB_TOKEN }}

    steps:
      - name: Require guarded write token
        run: |
          if [ -z "$FIELD_TOKEN" ]; then
            echo "::error::RUNNER_GITHUB_TOKEN is required. Use a fine-grained token scoped to lrnolivia/field with Contents write and Pull requests write."
            exit 1
          fi

      - name: Checkout field
        uses: actions/checkout@v6
        with:
          repository: lrnolivia/field
          ref: main
          path: target
          token: ${{ env.FIELD_TOKEN }}

      - name: Checkout attribution guard
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: relay

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: target/package-lock.json

      - name: Regenerate lockfile only
        id: repair
        working-directory: target
        run: |
          npm install --package-lock-only --ignore-scripts
          if git diff --quiet -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package-lock.json is already synchronized."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- package-lock.json
          fi

      - name: Guard repair scope
        if: steps.repair.outputs.changed == 'true'
        working-directory: target
        run: |
          unexpected="$(git status --short | grep -vE '^ M package-lock\.json$' || true)"
          if [ -n "$unexpected" ]; then
            echo "::error::Repair changed files outside package-lock.json:"
            echo "$unexpected"
            exit 1
          fi

      - name: Verify clean install
        if: steps.repair.outputs.changed == 'true'
        timeout-minutes: 10
        working-directory: target
        run: npm ci

      - name: Verify build
        if: steps.repair.outputs.changed == 'true'
        timeout-minutes: 10
        working-directory: target
        run: npm run build:all

      - name: Verify unit tests
        id: tests
        if: steps.repair.outputs.changed == 'true'
        timeout-minutes: 5
        continue-on-error: true
        working-directory: target
        run: npm run test:run -- --reporter=verbose

      - name: Verify lint
        id: lint
        if: steps.repair.outputs.changed == 'true'
        timeout-minutes: 10
        continue-on-error: true
        working-directory: target
        run: npm run lint

      - name: Open repair PR
        if: steps.repair.outputs.changed == 'true'
        working-directory: target
        env:
          GH_TOKEN: ${{ env.FIELD_TOKEN }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        run: |
          branch="automation/dependency-lockfile-${GITHUB_RUN_ID}"
          git config --local user.name "Lauren Olivia"
          git config --local user.email "lrnoliv@gmail.com"
          git checkout -b "$branch"
          git add package-lock.json
          git commit -m "Repair package lockfile"
          node ../relay/scripts/project-attribution.mjs check HEAD --repo "$PWD"
          git push origin "$branch"

          draft_arg=""
          title="Repair field package lockfile"
          if [ "$TEST_OUTCOME" != "success" ] || [ "$LINT_OUTCOME" != "success" ]; then
            draft_arg="--draft"
            title="Repair field package lockfile (verification warnings)"
          fi

          body_file="$(mktemp)"
          cat > "$body_file" <<'BODY'
          Repair the dependency lockfile after verifying the dependency repair path.

          Scope:
          - changes only `package-lock.json`
          - clean `npm ci`: passed
          - `npm run build:all`: passed
          BODY
          printf '%s\n' "- unit tests: ${TEST_OUTCOME}" "- lint: ${LINT_OUTCOME}" >> "$body_file"
          printf '\n%s\n' "When tests or lint are not healthy, this PR is opened as a draft for independent review of the dependency repair." >> "$body_file"

          gh pr create \
            --repo lrnolivia/field \
            --base main \
            --head "$branch" \
            --title "$title" \
            $draft_arg \
            --body-file "$body_file"
