name: runner tick

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      worker_id:
        description: "Optional worker id to run immediately instead of the normal due-work tick"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: loew-runner
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Run due workers or requested worker
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAIKEY }}
          RUNNER_GITHUB_TOKEN: ${{ secrets.RUNNER_GITHUB_TOKEN }}
          REQUESTED_WORKER: ${{ inputs.worker_id }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$REQUESTED_WORKER" ]; then
            npm run run -- "$REQUESTED_WORKER"
          else
            npm run tick
          fi

      - name: Persist runner state
        run: |
          if git diff --quiet -- state reports; then
            echo "No state changes."
            exit 0
          fi
          git config user.name "loew-runner"
          git config user.email "actions@users.noreply.github.com"
          git add state reports
          git commit -m "runner: persist worker state"
          git push
